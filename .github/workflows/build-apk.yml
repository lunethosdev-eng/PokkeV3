name: Build Pokke APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Ensure core submodule
        run: |
          if [ ! -d core/service/loginSync ]; then
            echo "core incomplete — cloning multiplatform branch..."
            rm -rf core
            git clone --depth 1 --branch multiplatform https://github.com/maxrave-dev/core.git core
          fi
          ls core/service/ | head -20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure build
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties
          touch local.properties

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find androidApp/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*debug*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found"
            find . -name "*.apk" || true
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokke-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
